apiVersion: v1
kind: Secret
metadata:
  name: order-db
type: Opaque
stringData:
  DATA_SOURCE_URL: "root:s3cr3t@tcp(mysql:3306)/orders?charset=utf8mb4&parseTime=True&loc=Local"
---
apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    app: order
spec:
  selector:
    app: order
  ports:
    - name: grpc
      port: 8080
      protocol: TCP
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: microservices/order
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8080
          env:
            - name: APPLICATION_PORT
              value: "8080"
            - name: ENV
              value: production
            - name: PAYMENT_SERVICE_URL
              value: "payment:8081"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: DATA_SOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db
                  key: DATA_SOURCE_URL
            # Uncomment after installing a collector or Jaeger (Chapter 9):
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://jaeger-collector.jaeger.svc.cluster.local:4317
          # Kubernetes calls the standard gRPC health service directly.
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30 # up to 150 s while MySQL starts
          readinessProbe:
            grpc:
              port: 8080
              service: order.v1.OrderService
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Public entry point: NGINX terminates TLS (certificate from cert-manager) and
# forwards gRPC to the order Service. Every Order RPC path starts with
# /order.v1.OrderService/, so that prefix routes them all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ingress.local
      secretName: order-tls
  rules:
    - host: ingress.local
      http:
        paths:
          - path: /order.v1.OrderService
            pathType: Prefix
            backend:
              service:
                name: order
                port:
                  name: grpc
