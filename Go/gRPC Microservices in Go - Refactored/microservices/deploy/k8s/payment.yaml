apiVersion: v1
kind: Secret
metadata:
  name: payment-db
type: Opaque
stringData:
  DATA_SOURCE_URL: "root:s3cr3t@tcp(mysql:3306)/payments?charset=utf8mb4&parseTime=True&loc=Local"
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app: payment
spec:
  # Headless: DNS returns every Payment pod IP, and Order's gRPC client
  # balances calls across them with round_robin (Chapter 5, client-side LB).
  clusterIP: None
  selector:
    app: payment
  ports:
    - name: grpc
      port: 8081
      protocol: TCP
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: microservices/payment
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8081
          env:
            - name: APPLICATION_PORT
              value: "8081"
            - name: ENV
              value: production
            - name: DATA_SOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: DATA_SOURCE_URL
            # Uncomment after installing a collector or Jaeger (Chapter 9):
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://jaeger-collector.jaeger.svc.cluster.local:4317
          # Kubernetes calls the standard gRPC health service directly.
          startupProbe:
            grpc:
              port: 8081
            periodSeconds: 5
            failureThreshold: 30 # up to 150 s while MySQL starts
          readinessProbe:
            grpc:
              port: 8081
              service: payment.v1.PaymentService
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 8081
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
