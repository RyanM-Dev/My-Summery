# The whole stack: MySQL, Kafka, Payment, Order, Shipping, and Jaeger for traces.
#   Sync:  Order → Payment (gRPC)
#   Async: Order → Kafka "orders" → Shipping → Kafka "shipments" → Order
#   make up      → build and start
#   make up-tls  → same, with mTLS between Order and Payment (run `make certs` first)
name: microservices

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: s3cr3t # development only
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ps3cr3t"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "${KAFKA_PORT:-9092}:9092" # clients on your machine: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft: no ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # single broker
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics come from create-topics.sh
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    volumes:
      - ./deploy/kafka/create-topics.sh:/create-topics.sh:ro

  payment:
    image: microservices/payment:dev
    build:
      context: .
      dockerfile: payment/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APPLICATION_PORT: "8081"
      ENV: development
      DATA_SOURCE_URL: "root:s3cr3t@tcp(mysql:3306)/payments?charset=utf8mb4&parseTime=True&loc=Local"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    # No published port: only Order calls Payment, over the Compose network.

  order:
    image: microservices/order:dev
    build:
      context: .
      dockerfile: order/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      payment:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${ORDER_PORT:-8080}:8080"
    environment:
      APPLICATION_PORT: "8080"
      ENV: development
      DATA_SOURCE_URL: "root:s3cr3t@tcp(mysql:3306)/orders?charset=utf8mb4&parseTime=True&loc=Local"
      PAYMENT_SERVICE_URL: payment:8081
      KAFKA_BROKERS: kafka:19092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

  shipping:
    image: microservices/shipping:dev
    build:
      context: .
      dockerfile: shipping/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${SHIPPING_PORT:-8082}:8082"
    environment:
      APPLICATION_PORT: "8082"
      ENV: development
      DATA_SOURCE_URL: "root:s3cr3t@tcp(mysql:3306)/shipments?charset=utf8mb4&parseTime=True&loc=Local"
      KAFKA_BROKERS: kafka:19092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # UI: http://localhost:16686
    # OTLP gRPC (4317) is reachable from the other containers.
